<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Internal CSS Example</title>
<style>
    body {
        background-color: lightyellow;
    }

    h1 {
        color: darkblue;
        text-align: center;
    }
</style>
</head>
<body>

    <h1>This is Internal CSS</h1>
    <p>The background color and heading style are defined inside a &lt;style&gt; tag in the same HTML file.</p>

</body>
</html>
